<!doctype html>
<html lang="en" data-theme="light" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NERV-TRUST — NWP Reliability & Error Intelligence. Forecast reliability layer for identifying when an NWP forecast is likely to fail, why the model flags it, and what happened in similar historical cases." />
    <title>NERV-TRUST — NWP Reliability & Error Intelligence</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('nerv_theme_v2');
          if (saved === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.css" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
